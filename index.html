<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First CI/CD App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>My First CI/CD App 🚀</h1>

    <p>Enter your name:</p>

    <input
        type="text"
        id="name"
        placeholder="Your name"
    >

    <br>

    <button onclick="greet()">
        Submit
    </button>

    <div id="result"></div>
</div>

<script>
    function greet() {
        const name = document.getElementById("name").value;

        if (name.trim() === "") {
            document.getElementById("result").innerText =
                "Please enter your name.";
        } else {
            document.getElementById("result").innerText =
                `Hello, ${name}! CI/CD is working 🚀`;
        }
    }
</script>

</body>
</html>
